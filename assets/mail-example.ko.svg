<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="합성 데이터로 재구성한 설명용 예시 · 실제 운영 화면이 아닙니다."><title>합성 데이터로 재구성한 설명용 예시 · 실제 운영 화면이 아닙니다.</title><g font-family="Portfolio Sans, Noto Sans KR, Droid Sans, sans-serif"><rect x="0" y="0" width="1000" height="230" rx="12" fill="#E7F2EE" stroke="#E7F2EE"/><text x="24" y="33" font-size="12" fill="#087F72" font-weight="700" text-anchor="start">SYNTHETIC EXAMPLE / INFORMATION STRUCTURE</text><rect x="24" y="52" width="304" height="127" rx="8" fill="#FFFFFF" stroke="#D8E3DF"/><text x="42" y="83" font-size="13" fill="#5B6D70" font-weight="700" text-anchor="start">PROVIDER A</text><text x="42" y="115" font-size="15" fill="#5B6D70" font-weight="400" text-anchor="start">회신 → 추출 → 적재</text><text x="42" y="154" font-size="21" fill="#087F72" font-weight="700" text-anchor="start">적재 확인</text><rect x="348" y="52" width="304" height="127" rx="8" fill="#FFFFFF" stroke="#D8E3DF"/><text x="366" y="83" font-size="13" fill="#5B6D70" font-weight="700" text-anchor="start">PROVIDER B</text><text x="366" y="115" font-size="15" fill="#5B6D70" font-weight="400" text-anchor="start">분류의 낮은 확신도</text><text x="366" y="154" font-size="21" fill="#087F72" font-weight="700" text-anchor="start">검토 필요</text><rect x="672" y="52" width="304" height="127" rx="8" fill="#FFFFFF" stroke="#D8E3DF"/><text x="690" y="83" font-size="13" fill="#5B6D70" font-weight="700" text-anchor="start">PROVIDER C</text><text x="690" y="115" font-size="15" fill="#5B6D70" font-weight="400" text-anchor="start">정기 요청 발송</text><text x="690" y="154" font-size="21" fill="#087F72" font-weight="700" text-anchor="start">회신 대기</text><text x="24" y="210" font-size="12" fill="#5B6D70" font-weight="400" text-anchor="start">합성 데이터로 재구성한 설명용 예시 · 실제 운영 화면이 아닙니다.</text></g></svg>