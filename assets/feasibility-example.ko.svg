<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="합성 데이터로 재구성한 설명용 예시 · 실제 운영 화면이 아닙니다."><title>합성 데이터로 재구성한 설명용 예시 · 실제 운영 화면이 아닙니다.</title><g font-family="Portfolio Sans, Noto Sans KR, Droid Sans, sans-serif"><rect x="0" y="0" width="1000" height="230" rx="12" fill="#E7F2EE" stroke="#E7F2EE"/><text x="24" y="33" font-size="12" fill="#087F72" font-weight="700" text-anchor="start">SYNTHETIC EXAMPLE / INFORMATION STRUCTURE</text><rect x="24" y="52" width="304" height="127" rx="8" fill="#FFFFFF" stroke="#D8E3DF"/><text x="42" y="83" font-size="13" fill="#5B6D70" font-weight="700" text-anchor="start">EXAMPLE PARCEL / 규정</text><text x="42" y="115" font-size="15" fill="#5B6D70" font-weight="400" text-anchor="start">출처·조회 시점 표시</text><text x="42" y="154" font-size="21" fill="#087F72" font-weight="700" text-anchor="start">추가 확인 필요</text><rect x="348" y="52" width="304" height="127" rx="8" fill="#FFFFFF" stroke="#D8E3DF"/><text x="366" y="83" font-size="13" fill="#5B6D70" font-weight="700" text-anchor="start">EXAMPLE PARCEL / 계통</text><text x="366" y="115" font-size="15" fill="#5B6D70" font-weight="400" text-anchor="start">필요 정보가 없는 경우</text><text x="366" y="154" font-size="21" fill="#087F72" font-weight="700" text-anchor="start">자료 부족</text><rect x="672" y="52" width="304" height="127" rx="8" fill="#FFFFFF" stroke="#D8E3DF"/><text x="690" y="83" font-size="13" fill="#5B6D70" font-weight="700" text-anchor="start">EXAMPLE PARCEL / 재무</text><text x="690" y="115" font-size="15" fill="#5B6D70" font-weight="400" text-anchor="start">입력 가정과 결과 구분</text><text x="690" y="154" font-size="21" fill="#087F72" font-weight="700" text-anchor="start">가정 검토</text><text x="24" y="210" font-size="12" fill="#5B6D70" font-weight="400" text-anchor="start">합성 데이터로 재구성한 설명용 예시 · 실제 운영 화면이 아닙니다.</text></g></svg>