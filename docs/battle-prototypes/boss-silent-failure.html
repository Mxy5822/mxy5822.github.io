<script>
const PAL = {
  A:'#2e1a10', B:'#7d4e26', C:'#b5793a', D:'#d49a5c',
  E:'#100a10', F:'#241a20', G:'#3a2a20', H:'#55402e',
  I:'#4a4440', J:'#8a8078', K:'#cfc8bc', L:'#f0ece0',
  M:'#0f0d18', N:'#1c1830', O:'#2e2a44', P:'#4a4468',
  Q:'#3f0e12', R:'#6b1418', S:'#bd2421', T:'#e04838',
  U:'#4a3a18', V:'#947d42', W:'#c9a94f', X:'#e7cb6b',
  Y:'#3a3632', Z:'#6e6862', a:'#a29a90',
  b:'#1c1410', c:'#3a2c1e', d:'#5a4630',
  e:'#181818',
  f:'#55524c', g:'#2a2724',
  h:'#c3bbae', i:'#948d80',
  j:'#6a3d8f', k:'#9d6bc4'
};
const ROWS = 60, COLS = 48;
// BX shifts the whole character right so a full-length blade fits to the left
const BX = 8;

// opts: o = torso/arm vertical offset, headO = head offset (defaults to o;
// larger = bowed head), headX = head horizontal offset (jerk back = +1),
// xo = whole-sprite horizontal offset,
// arm = 'idle' | 'grip' (crouch, left hand crosses to the hilt) |
//       'draw' (blade halfway out of the scabbard) | 'sweep' | 'slash' |
//       'guard' (near arm snaps up to block),
// legs = 'stand' | 'kneel', streak = motion arc on/off.
// He is LEFT-handed: the far arm (viewer-right) draws and swings the sword.
// Hanging hair strands are head-locked (always +headO/+headX) — no lag.
function buildFrame(opts) {
  const { o = 0, xo = 0, arm = 'idle', legs = 'stand', streak = false } = opts;
  const hd = opts.headO !== undefined ? opts.headO : o;
  const hx = opts.headX || 0;
  const g = Array.from({length: ROWS}, () => Array(COLS).fill(null));
  const px  = (r,c,k) => { r += 0; c += xo + BX; if (r>=0 && r<ROWS && c>=0 && c<COLS) g[r][c] = k; };
  const rect  = (r1,r2,c1,c2,k) => { for (let r=r1;r<=r2;r++) for (let c=c1;c<=c2;c++) px(r,c,k); };
  const vline = (c,r1,r2,k) => { for (let r=r1;r<=r2;r++) px(r,c,k); };
  const hline = (r,c1,c2,k) => { for (let c=c1;c<=c2;c++) px(r,c,k); };
  const pxU  = (r,c,k) => px(r+o,c,k);
  const rectU  = (r1,r2,c1,c2,k) => rect(r1+o,r2+o,c1,c2,k);
  const vlineU = (c,r1,r2,k) => vline(c,r1+o,r2+o,k);
  const hlineU = (r,c1,c2,k) => hline(r+o,c1,c2,k);
  const pxH  = (r,c,k) => px(r+hd,c+hx,k);
  const rectH  = (r1,r2,c1,c2,k) => rect(r1+hd,r2+hd,c1+hx,c2+hx,k);
  const vlineH = (c,r1,r2,k) => vline(c+hx,r1+hd,r2+hd,k);
  const hlineH = (r,c1,c2,k) => hline(r+hd,c1+hx,c2+hx,k);

  // ---- head + hair + face (head offset) ----
  // crown: flat 2-row band of twists hugging the scalp
  rectH(5,6,13,25,'E');
  pxH(4,14,'E'); pxH(4,15,'E'); pxH(4,17,'E'); pxH(4,18,'E');
  pxH(4,20,'E'); pxH(4,21,'E'); pxH(4,23,'E'); pxH(4,24,'E');
  vlineH(16,5,6,'F'); vlineH(19,5,6,'F'); vlineH(22,5,6,'F'); vlineH(25,5,6,'F');
  pxH(5,14,'H'); pxH(5,20,'H'); pxH(6,17,'G'); pxH(6,23,'G');
  pxH(6,14,'G'); pxH(6,21,'G');
  rectH(7,15,14,21,'C'); vlineH(21,7,15,'B'); vlineH(20,8,15,'B');
  pxH(7,14,'D'); pxH(8,14,'D'); pxH(8,15,'D');
  // fringe: three short twists hanging over the forehead, gold-tipped
  pxH(7,15,'E'); pxH(8,15,'X');
  pxH(7,18,'E'); pxH(8,18,'W');
  pxH(7,20,'E'); pxH(7,21,'E'); pxH(8,21,'W');
  pxH(9,15,'A'); pxH(9,16,'A'); pxH(9,18,'A'); pxH(9,19,'A');
  pxH(10,15,'L'); pxH(10,16,'E'); pxH(10,18,'E'); pxH(10,19,'L');
  pxH(11,13,'C'); pxH(12,13,'B');
  pxH(14,15,'B'); hlineH(15,15,20,'B');
  pxH(15,15,'b'); pxH(15,16,'b'); pxH(15,17,'b');
  pxH(5,11,'E'); pxH(5,12,'E'); vlineH(11,6,15,'E'); vlineH(12,6,14,'F');
  pxH(7,11,'H'); pxH(9,11,'H'); pxH(11,11,'H'); pxH(13,11,'H');
  pxH(8,12,'H'); pxH(10,12,'H'); pxH(12,12,'H');
  pxH(15,11,'E'); pxH(16,11,'W'); pxH(15,12,'X');
  rectH(6,16,22,23,'E'); vlineH(22,7,13,'F');
  pxH(8,22,'H'); pxH(10,22,'H'); pxH(12,22,'H'); pxH(14,22,'H');
  pxH(7,23,'H'); pxH(9,23,'H'); pxH(11,23,'H'); pxH(13,23,'H'); pxH(15,23,'H');
  pxH(17,22,'W'); pxH(17,23,'X');
  // back-right twist, jaw length with gold tip
  vlineH(24,5,12,'E'); vlineH(25,6,13,'F');
  pxH(7,24,'H'); pxH(9,24,'H'); pxH(11,24,'H');
  pxH(8,25,'H'); pxH(10,25,'H'); pxH(12,25,'H');
  pxH(13,24,'W'); pxH(14,24,'X');
  rectU(16,17,16,19,'B'); pxU(16,17,'C'); pxU(17,17,'C');
  hlineU(18,14,22,'b');
  rectU(19,21,10,14,'Y'); pxU(19,10,'I'); pxU(20,10,'I'); pxU(20,12,'f');
  rectU(19,20,15,23,'Y');
  rectU(19,21,24,27,'Y'); vlineU(27,19,21,'b'); pxU(20,25,'g');
  pxU(19,16,'W'); pxU(20,17,'V'); pxU(21,18,'X'); pxU(20,19,'V'); pxU(19,20,'W');
  rectU(21,31,14,25,'Y'); vlineU(14,21,31,'I'); rectU(21,31,23,25,'b');
  vlineU(15,21,30,'f');
  pxU(23,17,'g'); pxU(24,18,'g'); pxU(26,19,'g'); pxU(27,20,'g');
  pxU(24,21,'g'); pxU(28,16,'g'); hlineU(30,17,21,'g');
  // ---- arms by pose ----
  if (arm === 'idle') {
    // left (far) arm hanging
    rectU(21,24,26,27,'Y'); pxU(24,27,'b');
    rectU(25,32,26,27,'B'); vlineU(27,25,32,'A');
    rectU(33,34,26,27,'B');
    // right (near) arm hanging
    rectU(21,24,11,13,'Y'); pxU(21,11,'I'); hlineU(24,11,13,'b');
    rectU(25,31,11,13,'C'); vlineU(13,25,31,'B'); pxU(26,12,'D'); pxU(27,12,'D');
  } else if (arm === 'guard' || arm === 'charge') {
    // left (far) arm hanging
    rectU(21,24,26,27,'Y'); pxU(24,27,'b');
    rectU(25,32,26,27,'B'); vlineU(27,25,32,'A');
    rectU(33,34,26,27,'B');
    // right (near) arm snaps up: forearm across the chest, fist at chin height
    // (charge reuses the same raised-arm pose; the orb overlay sells the cast)
    rectU(21,24,11,13,'Y'); pxU(21,11,'I'); hlineU(24,11,13,'b');
    rectU(22,25,10,11,'C');                          // raised forearm
    rectU(19,22,9,10,'C'); pxU(19,9,'D');            // fist guarding the chin
  } else if (arm === 'cast') {
    // left (far) arm hanging
    rectU(21,24,26,27,'Y'); pxU(24,27,'b');
    rectU(25,32,26,27,'B'); vlineU(27,25,32,'A');
    rectU(33,34,26,27,'B');
    // right (near) arm thrust straight at the enemy, palm open
    rectU(21,24,11,13,'Y'); pxU(21,11,'I'); hlineU(24,11,13,'b');
    rectU(22,24,4,10,'C');
  } else if (arm === 'grip') {
    // left (far) arm reaches across the body to the hilt at the near hip
    rectU(21,23,24,27,'Y'); pxU(23,27,'b');         // far sleeve
    rectU(24,25,23,25,'B'); rectU(25,26,22,23,'B'); // 2px-thick diagonal, solid B —
    rectU(26,27,20,21,'B'); rectU(27,28,18,19,'B'); // darker shading here vanishes
    rectU(28,29,16,17,'B'); rectU(29,30,15,16,'B'); // against the shirt tone
    // right (near) arm keeps hanging in front
    rectU(21,24,11,13,'Y'); pxU(21,11,'I'); hlineU(24,11,13,'b');
    rectU(25,31,11,13,'C'); vlineU(13,25,31,'B'); pxU(26,12,'D'); pxU(27,12,'D');
  } else if (arm === 'draw') {
    // left (far) arm mid-sweep: hilt pulled out past the hip, blade half-sheathed
    rectU(21,23,24,27,'Y'); pxU(23,27,'b');         // far sleeve
    rectU(24,25,23,25,'B'); rectU(25,26,21,22,'B'); // shallower 2px diagonal
    rectU(26,27,18,20,'B'); rectU(26,27,15,17,'B');
    rectU(26,27,12,14,'B');                         // forearm reaching past the hip
    rectU(26,28,10,11,'B');                         // fist
    // near (right) sleeve only; that arm trails behind like in the slash
    rectU(21,24,11,13,'Y'); pxU(21,11,'I'); hlineU(24,11,13,'b');
  } else if (arm === 'sweep') {
    // blade clear of the sheath, mid-arc: arm a hair lower than the slash
    rectU(21,23,24,27,'Y'); pxU(23,27,'b');         // far sleeve
    rectU(24,25,11,25,'B');                         // 2px band, slightly dropped
    rectU(23,26,9,10,'B'); pxU(26,9,'A');           // gripping fist
    // near (right) sleeve stays in front; that arm trails behind the torso
    rectU(21,24,11,13,'Y'); pxU(21,11,'I'); hlineU(24,11,13,'b');
  } else if (arm === 'slash') {
    // left (far) arm extended across the chest toward the enemy
    rectU(21,23,24,27,'Y'); pxU(23,27,'b');         // far sleeve
    rectU(23,24,11,25,'B');                         // straight 2px thrust in line with the blade
    rectU(22,25,9,10,'B'); pxU(25,9,'A');           // bigger gripping fist
    // right (near) sleeve stays in front; that arm trails behind the torso
    rectU(21,24,11,13,'Y'); pxU(21,11,'I'); hlineU(24,11,13,'b');
  }

  // ---- LOWER ----
  if (legs === 'stand') {
    // scabbard run (hangs from the belt, so it rides the torso offset)
    hlineU(33,14,18,'M'); hlineU(34,17,21,'M'); hlineU(35,20,24,'M');
    hlineU(36,26,28,'P'); hlineU(37,26,30,'N'); pxU(37,26,'M'); hlineU(38,28,31,'N');
    rectU(38,39,30,31,'W'); pxU(38,30,'X');
    rect(33,37,14,25,'a'); rect(33,37,22,25,'Z'); hline(37,17,21,'Y');
    px(34,15,'h'); px(35,15,'h'); px(36,18,'i'); px(35,20,'i');
    rect(38,51,13,17,'a'); vline(17,38,51,'Z'); hline(51,13,17,'Z');
    vline(14,39,50,'h'); hline(44,15,16,'i'); px(45,15,'i'); px(49,16,'i');
    rect(38,51,21,25,'Z'); vline(24,38,51,'Y'); vline(25,38,51,'Y');
    px(39,21,'i'); hline(44,21,23,'Y'); px(45,22,'Y');
    // belt + near-arm hand AFTER the pants so the bob offset can't erase them
    hlineU(32,14,25,'b'); pxU(32,16,'W'); pxU(32,19,'c'); pxU(32,22,'c');
    if (arm === 'idle' || arm === 'grip') { rectU(32,33,12,14,'C'); pxU(33,12,'B'); pxU(33,14,'B'); }
    rect(52,56,10,17,'K'); px(52,16,'J'); px(53,10,'L'); px(53,11,'L'); px(54,14,'J');
    px(53,13,'J'); px(54,12,'J'); px(52,12,'L');
    hline(55,10,17,'J'); hline(56,10,17,'Z');
    rect(52,56,21,26,'K'); px(52,21,'J'); px(53,25,'J'); px(54,23,'J'); px(53,22,'L');
    hline(55,21,26,'J'); hline(56,21,26,'Z');
  } else {
    // KNEEL (designed for o=6): front thigh HORIZONTAL to a forward knee with
    // the shin planted below it; back knee ON the ground, lower leg folded
    // behind. No scabbard (hidden behind the folded legs).
    rect(39,42,15,24,'a'); rect(39,42,21,24,'Z');   // hips, low
    hlineU(32,14,25,'b'); pxU(32,16,'W'); pxU(32,19,'c'); // belt rides with the torso (over hips)
    if (arm === 'idle') { rectU(32,33,12,14,'C'); pxU(33,12,'B'); pxU(33,14,'B'); }
    // front leg
    rect(39,42,9,16,'a'); vline(16,40,42,'Z'); hline(42,10,15,'Z'); // horizontal thigh to the knee
    rect(42,52,9,12,'a'); vline(12,43,52,'Z');      // shin dropping from the knee
    rect(52,56,7,14,'K'); px(53,7,'L'); px(53,8,'L');
    hline(55,7,14,'J'); hline(56,7,14,'Z');         // planted sneaker
    // back leg
    rect(41,50,19,23,'Z'); vline(23,41,50,'Y');     // thigh sloping down to the ground
    rect(50,55,20,24,'Y');                          // knee at the ground
    rect(52,56,24,29,'K'); px(52,28,'J');
    hline(55,24,29,'J'); hline(56,24,29,'Z');       // tucked sneaker behind
  }

  // ---- auto-outline ----
  const out = g.map(row => row.slice());
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (g[r][c] === null) continue;
    const nb = [[r-1,c],[r+1,c],[r,c-1],[r,c+1]];
    for (const [rr,cc] of nb) {
      if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || g[rr][cc] === null) { out[r][c] = 'e'; break; }
    }
  }

  // ---- post-outline layer (xo applied manually here) ----
  const post = (r,c,k) => { c += xo + BX; if (r>=0 && r<ROWS && c>=0 && c<COLS) out[r][c] = k; };
  // scabbard tip + fittings (standing only; rides the torso offset with the belt)
  if (legs === 'stand') {
    [[36,26,'P'],[36,27,'P'],[36,28,'P'],[37,26,'P'],[37,27,'O'],[37,28,'O'],[37,29,'O'],[37,30,'O'],
     [38,26,'O'],[38,27,'O'],[38,28,'O'],[38,29,'O'],[38,30,'W'],[38,31,'W'],[39,30,'W'],[39,31,'X'],
     [36,25,'W'],[37,25,'W']].forEach(([r,c,k]) => post(r+o,c,k));
  }
  // beard (head-locked)
  [[14,16,'b'],[15,15,'b'],[15,18,'b']].forEach(([r,c,k]) => post(r+hd,c+hx,k));
  // raised guard/charge fist re-posted over its own outline
  if (arm === 'guard' || arm === 'charge') {
    [[20,9,'C'],[20,10,'C'],[21,10,'C'],[23,10,'C']].forEach(([r,c,k]) => post(r+o,c,k));
  }
  // katana dropped flat on the ground in front of the kneel (ground is static — no +o)
  if (legs === 'kneel') {
    [[55,-6,'L'],[55,-5,'K'],[55,-4,'K'],[55,-3,'K'],[55,-2,'K'],[55,-1,'K'],[55,0,'K'],[55,1,'K'],[55,2,'K'],[55,3,'K'],
     [56,-4,'P'],[56,-3,'P'],[56,-2,'P'],[56,-1,'P'],[56,0,'P'],[56,1,'P'],[56,2,'P'],
     [54,4,'W'],[55,4,'W'],[54,5,'X'],[55,5,'W']
    ].forEach(([r,c,k]) => post(r,c,k));
  }
  // sheathed hilt only while the blade is not drawn and standing
  if ((arm === 'idle' || arm === 'grip' || arm === 'guard' || arm === 'charge' || arm === 'cast') && legs === 'stand') {
    [[29,13,'W'],[29,14,'W'],[30,14,'X'],
     [28,12,'P'],[28,13,'P'],[27,11,'P'],[27,12,'K'],[26,10,'P'],[26,11,'P'],
     [25,9,'P'],[25,10,'K'],[24,9,'P'],
     [23,8,'W'],[23,9,'X'],[24,8,'W']].forEach(([r,c,k]) => post(r+o,c,k));
  }
  if (arm === 'grip' && legs === 'stand') {
    // left-hand fingers wrapped around the grip, gold peeking through
    [[28,14,'B'],[28,15,'B'],[29,15,'B'],[29,16,'C'],[30,15,'B']].forEach(([r,c,k]) => post(r+o,c,k));
  }
  // hanging hair strands (head-locked, drawn before the blade so a raised
  // sword reads in front of the hair)
  [[15,11,'E'],[16,11,'W'],[15,12,'X'],
   [16,22,'F'],[17,22,'W'],[17,23,'X'],
   [13,24,'W'],[14,24,'X']
  ].forEach(([r,c,k]) => post(r+hd,c+hx,k));
  // drawn blade
  if (arm === 'draw') {
    // freestanding forearm + fist re-posted over their own outline
    [[26,10,'B'],[26,11,'B'],[26,12,'B'],[26,13,'B'],[26,14,'B'],
     [27,10,'B'],[27,11,'B'],[27,12,'B'],[27,13,'B'],[27,14,'B'],
     [28,10,'B'],[28,11,'B'],
    // hilt in hand above the fist, blade angled back down into the sheath mouth
     [24,8,'X'],[25,9,'W'],[29,11,'W'],
     [29,12,'K'],[30,13,'K'],[31,14,'K'],[32,15,'P'],[33,16,'P']
    ].forEach(([r,c,k]) => post(r+o,c,k));
  } else if (arm === 'sweep') {
    post(25+o,8,'W'); post(26+o,8,'W');                      // guard
    [[24,9,'B'],[25,9,'B'],[23,10,'B'],[24,10,'B']].forEach(([r,c,k]) => post(r+o,c,k)); // fist over its own outline
    [[27,7,'K'],[28,6,'K'],[29,5,'K'],[30,4,'K'],[31,3,'K'],[32,2,'K'],[33,1,'K'],
     [28,7,'P'],[29,6,'P'],[30,5,'P'],[31,4,'P'],[32,3,'P'],[33,2,'P'],
     [34,0,'L'],[34,1,'K']
    ].forEach(([r,c,k]) => post(r+o,c,k));                   // full blade mid-arc, tip low-left
  } else if (arm === 'slash') {
    post(23+o,8,'W'); post(24+o,8,'W');                      // guard
    [[22,10,'B'],[23,9,'B'],[23,10,'B'],[24,9,'B'],[25,10,'B']].forEach(([r,c,k]) => post(r+o,c,k)); // fist over its own outline
    post(24+o,25,'B');                                       // keep the band 2px where it meets the sleeve
    [[23,-8,'L'],[24,-8,'K']].forEach(([r,c,k]) => post(r+o,c,k)); // tip
    for (let c = -7; c <= 7; c++) { post(23+o,c,'K'); post(24+o,c,'P'); } // full-length blade thrust at the enemy
    if (streak) {
      // draw-cut trail: arc fan swept up from the sheath at the hip,
      // plus wind flicks above the blade
      [[29,10,'P'],[28,6,'L'],[27,1,'L'],[26,-3,'L'],[25,-6,'P'],
       [28,11,'P'],[27,7,'P'],[26,3,'P'],[25,-1,'P'],[25,-4,'L'],
       [22,-3,'L'],[22,-6,'P'],[21,0,'P']
      ].forEach(([r,c,k]) => post(r+o,c,k));
    }
  } else if (arm === 'cast') {
    // thrust arm re-posted over the hilt + its own outline: top-lit D over C,
    // open hand at the far end (bolt overlay leaves from here)
    for (let c = 5; c <= 10; c++) { post(22+o,c,'D'); post(23+o,c,'C'); }
    [[22,3,'D'],[22,4,'D'],[23,3,'C'],[23,4,'C']].forEach(([r,c,k]) => post(r+o,c,k));
  }

  return out;
}

// idle: 2-frame breathing bob (everything moves together)
const IDLE = [buildFrame({o:0}), buildFrame({o:1})];
// attack: idle -> crouch + grip -> mid-draw -> sweep -> draw-cut (streak) -> hold -> return
const ATK = [
  buildFrame({o:0}),
  buildFrame({o:2, arm:'grip'}),
  buildFrame({o:1, arm:'draw'}),
  buildFrame({o:0, arm:'sweep'}),
  buildFrame({o:0, arm:'slash', streak:true}),
  buildFrame({o:0, arm:'slash'}),
  buildFrame({o:1, arm:'grip'})
];
const ATK_MS = [200, 240, 90, 70, 80, 160, 200];

// white-flash silhouette of a grid (impact frame)
function flashOf(grid) {
  return grid.map(row => row.map(k => k === null ? null : 'L'));

function drawGrid(ctx, grid, s, rows, cols) {
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, (cols||COLS)*s, (rows||ROWS)*s);
  const R2 = rows || ROWS, C2 = cols || COLS;
  for (let r = 0; r < R2; r++) for (let c = 0; c < C2; c++) {
    if (grid[r][c] === null) continue;

  }
}
